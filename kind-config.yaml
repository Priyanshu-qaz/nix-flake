kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".registry.mirrors."harbor.nbt.local"]
    endpoint = ["https://harbor.nbt.local"]
  [plugins."io.containerd.grpc.v1.cri".registry.configs."harbor.nbt.local".tls]
    ca_file = "/etc/containerd/certs.d/harbor.nbt.local/ca.crt"
