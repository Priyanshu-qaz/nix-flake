apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel
  namespace: observability

spec:
  mode: deployment

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch: {}

    exporters:

      # ================= OPENOBSERVE (SINGLE STREAM MODEL) =================
      otlphttp/openobserve:
        endpoint: http://openobserve.openobserve:5080/api/default
        headers:
          Authorization: Basic YWRtaW5AZXhhbXBsZS5jb206RHVDSmI4dmRocXZuQ3QyTw==
          stream-name: default

    service:
      pipelines:

        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/openobserve]

        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/openobserve]

        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/openobserve]
